<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoomlly Jams — Incoming Call</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep:    #0A0118;
      --bg-dark:    #14082B;
      --bg-card:    #1B0D38;
      --purple-900: #2D0A4E;
      --purple-700: #5B21B6;
      --purple-500: #A855F7;
      --purple-300: #C084FC;
      --magenta:    #E91E63;
      --pink:       #EC4899;
      --pink-light: #F472B6;
      --text:       #F5F1FA;
      --muted:      #B8A8D1;
      --accent-grad:      linear-gradient(135deg, #A855F7 0%, #EC4899 100%);
      --accent-grad-soft: linear-gradient(135deg, rgba(168,85,247,0.18) 0%, rgba(236,72,153,0.18) 100%);
      --shadow-glow: 0 0 40px rgba(168,85,247,0.25);
      --shadow-card: 0 12px 40px rgba(0,0,0,0.45);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 800px 600px at 10% 10%, rgba(168,85,247,0.18), transparent 60%),
        radial-gradient(ellipse 700px 500px at 90% 80%, rgba(236,72,153,0.14), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Top Nav ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,1,24,0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(168,85,247,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #F472B6 0%, #D946EF 60%, #A855F7 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      filter: drop-shadow(0 0 8px rgba(236,72,153,0.5));
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .topbar-center {
      font-family: 'Dancing Script', cursive;
      font-size: 22px;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .clock {
      font-size: 13px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(168,85,247,0.15);
      border: 1px solid rgba(168,85,247,0.35);
      color: var(--purple-300);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--purple-300);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.4; transform:scale(1.4); }
    }

    /* ── Call Banner ── */
    .call-banner {
      background: linear-gradient(135deg, rgba(45,10,78,0.9), rgba(20,8,43,0.95));
      border-bottom: 1px solid rgba(168,85,247,0.25);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 1;
      animation: slideDown 0.4s ease;
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }

    .call-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .call-icon {
      width: 54px;
      height: 54px;
      background: var(--accent-grad);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 24px rgba(168,85,247,0.5);
      flex-shrink: 0;
      animation: ring 1s ease-in-out 3;
    }

    @keyframes ring {
      0%,100% { transform: rotate(0deg); }
      20%     { transform: rotate(-15deg); }
      40%     { transform: rotate(15deg); }
      60%     { transform: rotate(-8deg); }
      80%     { transform: rotate(8deg); }
    }

    .call-meta h2 { font-size: 21px; font-weight: 700; }
    .call-meta p  { font-size: 13px; color: var(--muted); margin-top: 3px; }

    .call-phone {
      font-size: 26px;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
    }

    .call-time {
      text-align: right;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Main layout ── */
    .main {
      position: relative;
      z-index: 1;
      padding: 28px 32px;
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      animation: fadeUp 0.5s ease 0.15s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Cards ── */
    .card {
      background: rgba(27,13,56,0.85);
      border: 1px solid rgba(168,85,247,0.18);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(8px);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 20px;
      background: rgba(168,85,247,0.07);
      border-bottom: 1px solid rgba(168,85,247,0.15);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--purple-300);
    }

    .card-body { padding: 20px; }

    /* ── Left column ── */
    .left-col { display: flex; flex-direction: column; gap: 20px; }

    .avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: var(--accent-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      margin: 0 auto 14px;
      box-shadow: 0 0 30px rgba(168,85,247,0.4);
      border: 3px solid rgba(168,85,247,0.4);
    }

    .profile-name {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .profile-id {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      font-family: 'Courier New', monospace;
    }

    .profile-id span {
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .badge-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .badge-purple  { background: rgba(168,85,247,0.15); border: 1px solid rgba(168,85,247,0.35); color: var(--purple-300); }
    .badge-pink    { background: rgba(236,72,153,0.15); border: 1px solid rgba(236,72,153,0.35); color: var(--pink-light); }
    .badge-green   { background: rgba(34,197,94,0.13);  border: 1px solid rgba(34,197,94,0.3);  color: #86efac; }
    .badge-gold    { background: rgba(245,158,11,0.13); border: 1px solid rgba(245,158,11,0.3); color: #fcd34d; }
    .badge-red     { background: rgba(239,68,68,0.13);  border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; }
    .badge-muted   { background: rgba(184,168,209,0.1); border: 1px solid rgba(184,168,209,0.2); color: var(--muted); }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(168,85,247,0.1);
      gap: 12px;
    }

    .detail-row:last-child { border-bottom: none; }

    .dl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; flex-shrink: 0; }
    .dv { font-size: 13px; font-weight: 600; text-align: right; }

    /* ── Right column ── */
    .right-col { display: flex; flex-direction: column; gap: 20px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

    /* ── Stat cards ── */
    .stat-value {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .stat-value.green  { background: linear-gradient(135deg, #22c55e, #86efac); -webkit-background-clip: text; background-clip: text; }
    .stat-value.gold   { background: linear-gradient(135deg, #f59e0b, #fcd34d); -webkit-background-clip: text; background-clip: text; }

    .stat-label { font-size: 12px; color: var(--muted); margin-top: 6px; }

    /* ── Subscription ── */
    .plan-name {
      font-size: 24px;
      font-weight: 800;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    /* ── Genre bar ── */
    .genre-pill {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      background: var(--accent-grad-soft);
      border: 1px solid rgba(168,85,247,0.3);
      color: var(--purple-300);
      font-size: 13px;
      font-weight: 600;
      margin: 4px 4px 4px 0;
    }

    /* ── Points bar ── */
    .points-track {
      background: rgba(168,85,247,0.12);
      border-radius: 8px;
      height: 8px;
      margin-top: 12px;
      overflow: hidden;
    }

    .points-fill {
      height: 100%;
      background: var(--accent-grad);
      border-radius: 8px;
      transition: width 1s ease;
    }

    /* ── Music note decoration ── */
    .music-float {
      position: fixed;
      font-size: 18px;
      opacity: 0.06;
      animation: floatNote 6s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatNote {
      0%,100% { transform: translateY(0) rotate(-10deg); }
      50%      { transform: translateY(-20px) rotate(10deg); }
    }

    /* ── Not found ── */
    .not-found {
      text-align: center;
      padding: 80px 24px;
    }

    .not-found .nf-icon {
      font-size: 64px;
      margin-bottom: 20px;
      filter: grayscale(0.5);
    }

    .not-found h2 {
      font-size: 24px;
      font-weight: 700;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .not-found p { font-size: 14px; color: var(--muted); }

    /* ── Footer ── */
    .footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 16px 32px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid rgba(168,85,247,0.1);
      opacity: 0.5;
      background: #06010F;
    }

    @media (max-width: 960px) {
      .main { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- Floating music notes -->
<div class="music-float" style="top:15%;left:5%;animation-delay:0s">♪</div>
<div class="music-float" style="top:55%;left:92%;animation-delay:1.5s">♫</div>
<div class="music-float" style="top:80%;left:12%;animation-delay:3s">♩</div>
<div class="music-float" style="top:30%;left:88%;animation-delay:0.8s">♬</div>
<div class="music-float" style="top:70%;left:50%;animation-delay:2.2s">♪</div>

<!-- Top nav -->
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">🎵</div>
    <div class="brand-name">Zoomlly Jams</div>
  </div>
  <div class="topbar-center">Incoming Call</div>
  <div class="topbar-right">
    <div class="clock" id="clock"></div>
    <div class="live-pill"><div class="live-dot"></div>LIVE</div>
  </div>
</div>

<!-- Call banner -->
<div class="call-banner">
  <div class="call-left">
    <div class="call-icon">📞</div>
    <div class="call-meta">
      <h2 id="banner-name">Looking up caller…</h2>
      <p id="banner-sub">ANI lookup in progress</p>
    </div>
  </div>
  <div class="call-phone" id="banner-phone">—</div>
  <div class="call-time" id="call-time"></div>
</div>

<!-- Main content -->
<div class="main" id="main"></div>

<div class="footer">Zoomlly Jams &nbsp;·&nbsp; Agent Dashboard &nbsp;·&nbsp; Powered by APIIQ &nbsp;·&nbsp; Confidential</div>

<script>
  const API_KEY  = 'cef44c87-ac22-49e5-9edc-5f3205186e58';

  // Clock
  function tick() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  }
  tick(); setInterval(tick, 1000);

  // Timestamp
  document.getElementById('call-time').innerHTML =
    new Date().toLocaleString('en-US', {
      weekday:'long', month:'long', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit'
    }) + '<br><span style="font-size:11px;opacity:0.6">Agent notified</span>';

  // Helpers
  function initials(first, last) {
    return ((first||'')[0] + (last||'')[0]).toUpperCase() || '?';
  }
  function fmt$  (v) { return '$' + (parseFloat(v)||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
  function fmtPh (raw) {
    const d = String(raw||'').replace(/\D/g,'');
    return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : raw||'—';
  }

  function tierBadge(tier) {
    const map = { Platinum:'badge-gold', VIP:'badge-purple', Superfan:'badge-pink', Fan:'badge-muted' };
    return `<span class="badge ${map[tier]||'badge-muted'}">★ ${tier||'—'}</span>`;
  }

  function subBadge(status) {
    const map = { Active:'badge-green', Paused:'badge-gold', Cancelled:'badge-red', Expired:'badge-red' };
    return `<span class="badge ${map[status]||'badge-muted'}">${status||'—'}</span>`;
  }

  function acctBadge(status) {
    return `<span class="badge ${status==='Active'?'badge-green':'badge-red'}">${status||'—'}</span>`;
  }

  // Parse phone from URL (%E = E.164)
  const params  = new URLSearchParams(window.location.search);
  const rawPhone = params.get('phone') || '';
  let phone = rawPhone.replace(/\D/g,'');
  if (phone.length===11 && phone[0]==='1') phone = phone.slice(1);

  document.getElementById('banner-phone').textContent = fmtPh(phone) || rawPhone || '—';

  const main = document.getElementById('main');

  // Loading state
  main.style.gridTemplateColumns = '1fr';
  main.innerHTML = `
    <div class="card">
      <div class="card-body not-found" style="padding:60px">
        <div class="nf-icon" style="animation:pulse 1s infinite">🎵</div>
        <h2>Searching the groove…</h2>
        <p>${fmtPh(phone)}</p>
      </div>
    </div>`;

  async function load() {
    if (!phone || phone.length !== 10) {
      renderNotFound('Could not parse a valid 10-digit number.');
      return;
    }
    try {
      const res = await fetch(`/api/zoomlly/phone/${phone}?api_key=${API_KEY}`);
      if (res.status === 404) { renderNotFound(); return; }
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const json = await res.json();
      if (!json.success || !json.data) { renderNotFound(); return; }
      render(json.data);
    } catch(e) {
      main.innerHTML = `<div class="card"><div class="card-body not-found">
        <div class="nf-icon">⚠️</div><h2>Lookup Error</h2><p style="color:#fca5a5">${e.message}</p>
      </div></div>`;
    }
  }

  function renderNotFound(msg) {
    document.getElementById('banner-name').textContent = 'Unknown Caller';
    document.getElementById('banner-sub').textContent  = 'No matching account in Zoomlly Jams';
    main.style.gridTemplateColumns = '1fr';
    main.innerHTML = `
      <div class="card">
        <div class="card-body not-found">
          <div class="nf-icon">🎵</div>
          <h2>No Account Found</h2>
          <p>Phone number <strong style="color:var(--text)">${fmtPh(phone)}</strong> isn't in Zoomlly Jams.</p>
          ${msg?`<p style="margin-top:8px;opacity:.6">${msg}</p>`:''}
          <p style="margin-top:12px">The caller may be a new or unregistered member.</p>
        </div>
      </div>`;
  }

  function render(c) {
    document.getElementById('banner-name').textContent = `${c.first_name} ${c.last_name}`;
    document.getElementById('banner-sub').textContent  = `${c.customer_id} · ${c.subscription_plan} Plan · ${c.loyalty_tier}`;

    const bal     = parseFloat(c.total_spend)||0;
    const pts     = parseInt(c.loyalty_points)||0;
    const ptsPct  = Math.min(100, Math.round(pts / 250));  // cap at 25000 pts

    main.style.gridTemplateColumns = '320px 1fr';
    main.innerHTML = `

      <!-- LEFT -->
      <div class="left-col">

        <div class="card">
          <div class="card-header">♪ Member Profile</div>
          <div class="card-body" style="text-align:center">
            <div class="avatar">${initials(c.first_name, c.last_name)}</div>
            <div class="profile-name">${c.first_name} ${c.last_name}</div>
            <div class="profile-id">ID: <span>${c.customer_id}</span></div>
            <div class="badge-row">
              ${tierBadge(c.loyalty_tier)}
              ${subBadge(c.subscription_status)}
              ${acctBadge(c.account_status)}
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">♫ Account Details</div>
          <div class="card-body">
            <div class="detail-row"><span class="dl">Phone</span><span class="dv">${fmtPh(c.phone)}</span></div>
            <div class="detail-row"><span class="dl">Email</span><span class="dv" style="font-size:12px">${c.email||'—'}</span></div>
            <div class="detail-row"><span class="dl">Member Since</span><span class="dv">${c.member_since||'—'}</span></div>
            <div class="detail-row"><span class="dl">Genre</span><span class="dv">${c.preferred_genre||'—'}</span></div>
            <div class="detail-row"><span class="dl">Concert Credits</span>
              <span class="dv" style="background:var(--accent-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:18px;font-weight:800">${c.concert_credits||0}</span>
            </div>
            <div class="detail-row"><span class="dl">Store Credit</span><span class="dv" style="color:#86efac">${fmt$(c.store_credit)}</span></div>
          </div>
        </div>

      </div>

      <!-- RIGHT -->
      <div class="right-col">

        <!-- Subscription -->
        <div class="card">
          <div class="card-header">♩ Subscription</div>
          <div class="card-body" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
            <div>
              <div class="plan-name">${c.subscription_plan||'None'} Plan</div>
              <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px">
                ${subBadge(c.subscription_status)}
                <span style="font-size:12px;color:var(--muted)">Renews: <strong style="color:var(--text)">${c.subscription_renewal||'—'}</strong></span>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Preferred Genre</div>
              <div class="genre-pill">${c.preferred_genre||'Not set'}</div>
            </div>
          </div>
        </div>

        <!-- Stats row -->
        <div class="grid-3">
          <div class="card">
            <div class="card-header">♬ Total Spend</div>
            <div class="card-body">
              <div class="stat-value gold">${fmt$(c.total_spend)}</div>
              <div class="stat-label">Lifetime value</div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">♪ Last Order</div>
            <div class="card-body">
              <div class="stat-value" style="font-size:28px">${fmt$(c.last_order_amount)}</div>
              <div class="stat-label">${c.last_order_date||'—'} · <span style="color:var(--purple-300)">${c.last_order_id||'—'}</span></div>
            </div>
          </div>
          <div class="card">
            <div class="card-header">♫ Store Credit</div>
            <div class="card-body">
              <div class="stat-value green">${fmt$(c.store_credit)}</div>
              <div class="stat-label">${c.concert_credits||0} concert credit${c.concert_credits!==1?'s':''} available</div>
            </div>
          </div>
        </div>

        <!-- Loyalty -->
        <div class="card">
          <div class="card-header">★ Loyalty — ${c.loyalty_tier||'Fan'}</div>
          <div class="card-body">
            <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">
              <div>
                <div style="font-size:36px;font-weight:800;background:var(--accent-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1">${pts.toLocaleString()}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:4px">Points balance</div>
              </div>
              <div style="text-align:right">
                ${tierBadge(c.loyalty_tier)}
                <div style="font-size:11px;color:var(--muted);margin-top:6px">
                  ${c.loyalty_tier==='Platinum' ? 'Top tier — maximum benefits' :
                    c.loyalty_tier==='VIP'       ? 'Next: Platinum at 25,000 pts' :
                    c.loyalty_tier==='Superfan'  ? 'Next: VIP at 10,000 pts' :
                                                   'Next: Superfan at 2,500 pts'}
                </div>
              </div>
            </div>
            <div class="points-track">
              <div class="points-fill" style="width:${ptsPct}%"></div>
            </div>
          </div>
        </div>

      </div>`;
  }

  load();
</script>
</body>
</html>
